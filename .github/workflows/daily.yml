name: daily-collect-and-deploy

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = KST 07:00
  workflow_dispatch:
    inputs:
      backfill:
        description: "과거 backfill_days(기본 90일) 범위를 다시 수집"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      collect_outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect
        id: collect
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          PYTHONUTF8: "1"
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python -m collector.main --backfill
          else
            python -m collector.main
          fi

      - name: Commit data
        run: |
          git config user.name "bid-bot"
          git config user.email "bid-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): daily update $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build site
        run: |
          rm -rf site && mkdir site
          cp -r web/* site/
          mkdir -p site/data
          cp data/*.json site/data/ 2>/dev/null || echo '{"items":[]}' > site/data/notices.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail if collection failed
        if: needs.collect.outputs.collect_outcome == 'failure'
        run: |
          echo "::error::수집 단계가 실패했습니다. 화면 상단 배지와 data/meta.json의 errors를 확인하세요."
          exit 1
