# 수집 설정. 코드 수정 없이 이 파일만 바꿔 키워드·지역·보존기간을 조정한다.

# 공공기관(나라장터 용역) 공고명 검색 키워드 (OR)
# '평가' 단독은 노이즈가 커서(PQ·영향평가·연구 평가 등 90일 1,000건) 회계법인 업무에 맞는 구체어로 둔다.
public_keywords:
  - 회계
  - 세무
  - 재무
  - 실사
  - 감사
  - 결산
  - 원가계산
  - 원가산정
  - 원가분석
  - 원가검증
  - 원가조사
  - 경영평가
  - 성과평가
  - 가치평가
  - 기업가치
  - 자산평가
  - 자산재평가
  - 감정평가
  - 타당성
  - 사업성
  - 정산
  - 공정가치
  - 세무조정
  - 세무조사

# 공고명에 포함되면 제외 (공백 무시 비교)
public_exclude:
  - 안전평가
  - 안전점검
  - 환경영향평가
  - 교통영향평가
  - 성능평가
  - 내진성능
  - 정밀안전
  - 구조안전
  - 건축물 평가
  - 소방
  - 시설물
  - 사업수행능력
  - PQ
  - P.Q
  - 영향평가
  - 건설사업관리
  - 감리
  - 실시설계
  - 기본설계
  - 시스템 구축
  - 시스템구축
  - 플랫폼
  - 유지보수
  - 연수
  - 임차
  - 구매
  - 전시
  - 적합성
  - 공법선정
  - 기술제안서
  - 세무서
  - 세무고
  - 네트워크
  - 장비
  - 영상
  - 콘텐츠
  - 정산시스템
  - 요금정산
  - 정산 시스템

# 아파트(K-apt) 공고명 키워드 (OR, 제외어 없음)
apt_keywords:
  - 회계감사
  - 외부회계감사
  - 회계
  - 세무
  - 결산
  - 장기수선충당금 검토

# 아파트 트랙 수집 지역 (16개 시도 명칭 중). 빈 목록([])이면 전국.
# 호남만 보려면: [전남광주, 전북]
apt_regions: []

# 관심지역 ① 기관 소재지 — 공고기관/수요기관이 이 지역이면 "본사 소재"
interest_home_regions:
  - 전남광주

# 관심지역 ① 보조 — 이름에 지역이 없는 전남광주 소재 기관 (기관명 부분일치)
interest_institutions:
  - 한국전력공사
  - 한전KDN
  - 한국전력거래소
  - 한국농어촌공사
  - 한국농수산식품유통공사
  - 한국콘텐츠진흥원
  - 사립학교교직원연금공단
  - 우정사업정보센터
  - 국립전파연구원
  - 한국인터넷진흥원
  - 한국문화예술위원회
  - 한국방송통신전파진흥원
  - 농림식품기술기획평가원
  - 한국농촌경제연구원
  - 광주과학기술원
  - 한국광기술원
  - 광주테크노파크
  - 전남테크노파크
  - 전남대학교
  - 조선대학교
  - 광주은행
  - 한국에너지공과대학교
  - 광주도시공사
  - 전남개발공사
  - 광주광역시도시철도공사

# 관심지역 ② 지역제한 — 참가제한지역에 이 중 하나가 포함되면 "지역제한"
interest_limit_regions:
  - 전남광주
  - 광주
  - 전남
  - 전북
  - 호남

retention_days: 730          # 공고 보존기간(공고일 기준). 낙찰은 영구
backfill_days: 90            # 첫 실행 백필 범위
lookback_days: 3             # 매일 공고 조회 범위
award_lookback_days: 7       # 매일 낙찰(개찰일) 조회 범위
award_weekly_lookback_days: 60  # 일요일/백필 시 낙찰 조회 범위
apt_result_lookback_days: 90    # 아파트 결과 조회: 마감일이 이 일수 안인 공고만
max_calls_per_service: 300   # 서비스별 하루 호출 상한(포털 개발계정 한도 1,000의 안전선)

# 주타겟 업무 분류 (우리 회계법인 역량). 위에서부터 먼저 맞는 업무로 분류되고, 어디에도 없으면 "기타".
# keywords는 공고명에서 공백 무시 부분일치, exclude(선택)에 걸리면 그 업무로 보지 않는다.
# 업무를 추가/삭제하거나 키워드를 조정하면 다음 수집부터 전체 공고가 재분류된다.
service_lines:
  - name: 회계감사
    keywords: [회계감사, 외부감사, 결산감사, 재무제표감사, 감사용역, 재무제표 검토]
  - name: 세무조정
    keywords: [세무조정, 법인세신고, 법인세 신고, 세무신고]
  - name: 세무조사대응
    keywords: [세무조사]
    exclude: [교육, 연구, 분석]
  - name: 세무진단
    keywords: [세무진단, 세무점검, 세무리스크]
  - name: 세무컨설팅
    keywords: [세무컨설팅, 세무자문, 세무용역, 세무대리, 절세, 세무회계, 세무 및 회계, 회계 및 세무]
  - name: 기업실사
    keywords: [재무실사, 회계실사, 기업실사, 자산실사, 인수실사, 매각실사, 실사용역, 실사 용역, FDD, 재무검토, 재무 검토]
  - name: 공정가치평가
    keywords: [공정가치, 기업가치, 주식가치, 지분가치, 자산재평가, 영업권평가, 영업권 평가, 무형자산평가, 자산평가]
  - name: 사업비정산
    keywords: [사업비정산, 사업비 정산, 회계정산, 회계검증, 정산검증, 정산검토, 정산감사, 정산용역, 보조금정산, 보조사업정산, 집행점검]
  - name: PA
    keywords: [회계자문, 회계처리, 회계컨설팅, 회계분야, 결산자문, 결산지원, 결산업무, 재무결산, 결산위탁, 결산용역, 결산대행, 복식부기, 회계기준, 회계용역, 재무회계, 원가계산, 원가산정, 원가분석, 원가검증]
