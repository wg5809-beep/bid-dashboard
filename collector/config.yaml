# 수집 설정. 코드 수정 없이 이 파일만 바꿔 키워드·지역·보존기간을 조정한다.

# 공공기관(나라장터 용역) 공고명 검색 키워드 (OR)
public_keywords:
  - 회계
  - 세무
  - 재무
  - 실사
  - 평가
  - 감사
  - 결산
  - 원가
  - 자산재평가
  - 타당성
  - 사업성

# 공고명에 포함되면 제외 (공백 무시 비교)
public_exclude:
  - 안전평가
  - 안전점검
  - 환경영향평가
  - 교통영향평가
  - 성능평가
  - 내진성능
  - 정밀안전
  - 구조안전
  - 건축물 평가
  - 소방
  - 시설물

# 아파트(K-apt) 공고명 키워드 (OR, 제외어 없음)
apt_keywords:
  - 회계감사
  - 외부회계감사
  - 회계
  - 세무
  - 결산
  - 장기수선충당금 검토

# 아파트 트랙 수집 지역 (16개 시도 명칭 중)
apt_regions:
  - 전남광주
  - 전북

# 관심지역 ① 기관 소재지 — 공고기관/수요기관이 이 지역이면 "본사 소재"
interest_home_regions:
  - 전남광주

# 관심지역 ① 보조 — 이름에 지역이 없는 전남광주 소재 기관 (기관명 부분일치)
interest_institutions:
  - 한국전력공사
  - 한전KDN
  - 한국전력거래소
  - 한국농어촌공사
  - 한국농수산식품유통공사
  - 한국콘텐츠진흥원
  - 사립학교교직원연금공단
  - 우정사업정보센터
  - 국립전파연구원
  - 한국인터넷진흥원
  - 한국문화예술위원회
  - 한국방송통신전파진흥원
  - 농림식품기술기획평가원
  - 한국농촌경제연구원
  - 광주과학기술원
  - 한국광기술원
  - 광주테크노파크
  - 전남테크노파크
  - 전남대학교
  - 조선대학교
  - 광주은행
  - 한국에너지공과대학교
  - 광주도시공사
  - 전남개발공사
  - 광주광역시도시철도공사

# 관심지역 ② 지역제한 — 참가제한지역에 이 중 하나가 포함되면 "지역제한"
interest_limit_regions:
  - 전남광주
  - 광주
  - 전남
  - 전북
  - 호남

retention_days: 730          # 공고 보존기간(공고일 기준). 낙찰은 영구
backfill_days: 90            # 첫 실행 백필 범위
lookback_days: 3             # 매일 공고 조회 범위
award_lookback_days: 7       # 매일 낙찰(개찰일) 조회 범위
award_weekly_lookback_days: 60  # 일요일/백필 시 낙찰 조회 범위
apt_result_lookback_days: 90    # 아파트 결과 조회: 마감일이 이 일수 안인 공고만
max_calls_per_service: 100   # 서비스별 하루 호출 상한
